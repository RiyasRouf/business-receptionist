services:
  nginx:
    image: nginx:1.24-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html
    depends_on:
      - php
    networks:
      - aiwa

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - app_code:/var/www/html
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiwa

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aiwa_staging_db}
      POSTGRES_USER: ${DB_USERNAME:-aiwa_staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aiwa_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiwa

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aiwa

volumes:
  app_code:
  postgres_data:

networks:
  aiwa:
    driver: bridge

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-test:
    name: Lint + PHPStan + Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aiwa_test
          POSTGRES_USER: aiwa
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    outputs:
      has_app: ${{ steps.check_app.outputs.has_app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Laravel app
        id: check_app
        run: |
          if [ -f composer.json ]; then
            echo "has_app=true" >> $GITHUB_OUTPUT
          else
            echo "has_app=false" >> $GITHUB_OUTPUT
            echo "No composer.json — skipping app steps (Sprint 0)"
          fi

      - name: Setup PHP 8.3
        if: steps.check_app.outputs.has_app == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, pgsql, redis, mbstring, zip, bcmath, intl, gd, pcntl, opcache
          coverage: none

      - name: Cache Composer deps
        if: steps.check_app.outputs.has_app == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer deps
        if: steps.check_app.outputs.has_app == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        if: steps.check_app.outputs.has_app == 'true'
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=aiwa_staging_db/DB_DATABASE=aiwa_test/' .env
          sed -i 's/DB_USERNAME=aiwa_staging/DB_USERNAME=aiwa/' .env
          echo 'DB_PASSWORD=secret' >> .env

      - name: Generate app key
        if: steps.check_app.outputs.has_app == 'true'
        run: php artisan key:generate

      - name: Run migrations
        if: steps.check_app.outputs.has_app == 'true'
        run: php artisan migrate --force

      - name: ESLint (frontend)
        if: steps.check_app.outputs.has_app == 'true'
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
          else
            echo "No package.json — skipping ESLint"
          fi

      - name: PHPStan
        if: steps.check_app.outputs.has_app == 'true'
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "No phpstan config — skipping (add phpstan.neon in Sprint 1)"
          fi

      - name: PHP CS Fixer (lint)
        if: steps.check_app.outputs.has_app == 'true'
        run: |
          if [ -f .php-cs-fixer.php ] || [ -f .php-cs-fixer.dist.php ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "No CS fixer config — skipping (add in Sprint 1)"
          fi

      - name: Unit tests
        if: steps.check_app.outputs.has_app == 'true'
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aiwa_test
          DB_USERNAME: aiwa
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          APP_ENV: testing

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && needs.lint-and-test.outputs.has_app == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/var/www/aiwa-receptionist/releases/$(date +%Y%m%d%H%M%S)"
            SHARED_DIR="/var/www/aiwa-receptionist/shared"
            CURRENT_LINK="/var/www/aiwa-receptionist/current"

            # Clone fresh release — HTTPS, not SSH: repo is public, and this
            # avoids needing a deploy key + known_hosts entry provisioned on
            # every deploy target.
            git clone --branch develop https://github.com/RiyasRouf/business-receptionist.git "$RELEASE_DIR"
            cd "$RELEASE_DIR"

            # Link shared dirs. storage/ ships as a real directory from git
            # (tracked .gitignore placeholders) — plain `ln -sf` would drop
            # the symlink *inside* it instead of replacing it, silently
            # leaving every release writing to a non-persistent, wrong-owner
            # local copy. Must remove it first.
            rm -rf "$RELEASE_DIR/storage"
            ln -sfn "$SHARED_DIR/storage" "$RELEASE_DIR/storage"
            ln -sf "$SHARED_DIR/.env" "$RELEASE_DIR/.env"

            # Refresh secrets from GCP Secret Manager into shared/.env.
            # .env itself never holds real values in the repo (D-014-02) —
            # this keeps the on-disk copy in sync with whatever's current
            # in Secret Manager on every deploy, so a rotation there takes
            # effect on the next release without manual intervention.
            KEY_FILE="$SHARED_DIR/secrets/gcp-secretmanager-key.json"
            sudo gcloud auth activate-service-account --key-file="$KEY_FILE" --project=business-receptionist
            DB_PW=$(sudo gcloud secrets versions access latest --secret=staging-db-password --project=business-receptionist)
            JWT_SECRET_VAL=$(sudo gcloud secrets versions access latest --secret=staging-jwt-secret --project=business-receptionist)
            GEMINI_KEY=$(sudo gcloud secrets versions access latest --secret=gemini-api-key --project=business-receptionist)
            sudo gcloud auth revoke --all >/dev/null 2>&1 || true
            sudo gcloud config set account 487102398686-compute@developer.gserviceaccount.com >/dev/null 2>&1
            sudo sed -i "s#^DB_PASSWORD=.*#DB_PASSWORD=${DB_PW}#" "$SHARED_DIR/.env"
            sudo sed -i "s#^JWT_SECRET=.*#JWT_SECRET=${JWT_SECRET_VAL}#" "$SHARED_DIR/.env"
            sudo sed -i "s#^GEMINI_API_KEY=.*#GEMINI_API_KEY=${GEMINI_KEY}#" "$SHARED_DIR/.env"

            # Install deps
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Build frontend — nginx serves the SPA directly from
            # frontend/dist (Vite's default output), which git doesn't
            # track. Must be rebuilt fresh in every release directory.
            cd frontend
            npm ci --no-audit --no-fund
            npm run build
            cd ..

            # Run migrations
            php artisan migrate --force

            # Sprint 6 UAT seed data — idempotent (firstOrCreate), staging only
            php artisan db:seed --force

            # Cache config/routes
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Atomic symlink swap
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            # Reload PHP-FPM (zero downtime)
            sudo systemctl reload php8.3-fpm

            # Restart Horizon if present
            if php artisan horizon:status > /dev/null 2>&1; then
              php artisan horizon:terminate
            fi

            # Health check
            sleep 2
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Health check failed: HTTP $HTTP_STATUS"
              exit 1
            fi
            echo "Deploy complete. Health: $HTTP_STATUS"

            # Keep last 5 releases — sudo: older releases from manual
            # out-of-band deploys are www-data-owned, not writable by the
            # deploy user via group perms alone.
            ls -dt /var/www/aiwa-receptionist/releases/* | tail -n +6 | xargs -r sudo rm -rf
